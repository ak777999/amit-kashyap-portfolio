name: Unpack site assets
on:
  push:
    branches: [main]
    paths: ['_pack/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract assets
        run: |
          set -e
          cat _pack/assets.b64.part* | base64 -d > /tmp/assets.tgz
          echo "4b6638ae905f2a2743e8ca8ac90ec66b184a3072d23bb95ce27e03d18cdd3ba4  /tmp/assets.tgz" | sha256sum -c -
          tar xzf /tmp/assets.tgz
          git rm -rq _pack
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          git commit -m "Unpack site assets (images, reels, fonts)"
          git push
